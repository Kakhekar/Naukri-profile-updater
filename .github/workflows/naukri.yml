name: Naukri Auto Updater

on:
  # schedule:
    # - cron: '0 2 * * *'    # 7:30 AM IST
    # - cron: '0 8 * * *'    # 1:30 PM IST
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright python-dotenv
          playwright install firefox
          playwright install-deps firefox

      - name: Run Naukri Updater
        env:
          NAUK_AT:          ${{ secrets.NAUK_AT }}
          NAUK_SID:         ${{ secrets.NAUK_SID }}
          NAUK_RT:          ${{ secrets.NAUK_RT }}
          NAUKRI_HEADLINES: ${{ secrets.NAUKRI_HEADLINES }}
          NAUKRI_ABOUT:     ${{ secrets.NAUKRI_ABOUT }}
          YOUR_NAME:        ${{ secrets.YOUR_NAME }}
          RESUME_FILENAME:  ${{ secrets.RESUME_FILENAME }}
          HEADLESS:         "true"
        run: |
          python upload_resume.py
          python naukri_updater.py

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: "*.png"